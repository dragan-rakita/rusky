name: Deploy

on:
  push:
    branches: [dev]
  # Only a merged pull request into main deploys; a direct push to main does nothing.
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A deploy killed mid-migrate leaves the database half-upgraded, so never cancel one.
concurrency:
  group: deploy-${{ github.event.pull_request.merged && github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # After a merge the PR's merge ref is stale; check what the server will deploy.
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.base.ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn run check
      - run: yarn test

  deploy:
    needs: check
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Rusky shares the Holocron server (holocron2). Everything below stays inside
      # ~/opt/rusky, /var/www/rusky, ~/backups/rusky-* and the rusky-api pm2 process.
      - name: Deploy to holocron2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            cd ~/opt/rusky
            # The server checkout is never edited by hand, so it simply follows main.
            git fetch origin main
            git checkout -B main origin/main
            nvm use
            export PATH="$HOME/.local/bin:$(npm config get prefix)/bin:$PATH"
            yarn install --frozen-lockfile

            # Snapshot before a migration can touch it; keep the 30 newest.
            set -a; . ./apps/api/.env; set +a
            mkdir -p "$HOME/backups"
            if [ -f "$DATABASE_URL" ]; then
              sqlite3 "$DATABASE_URL" ".backup '$HOME/backups/rusky-$(date +%Y%m%d-%H%M%S).db'"
            fi
            ls -1t "$HOME"/backups/rusky-*.db 2>/dev/null | tail -n +31 | xargs -r rm --

            yarn db:migrate
            yarn build

            # nginx serves the app from here: it cannot read the 750 home folder.
            rsync -a --delete apps/web/build/ /var/www/rusky/
            pm2 restart rusky-api

            # It takes about three seconds to listen again; fail the deploy if it never does.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3010/api/health; then exit 0; fi
              sleep 1
            done
            echo "rusky-api did not come back"
            pm2 logs rusky-api --nostream --lines 40
            exit 1
