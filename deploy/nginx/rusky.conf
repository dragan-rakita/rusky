# /etc/nginx/sites-available/rusky, symlinked into sites-enabled.
# The app is static files in /var/www/rusky (the home folder is 750, so nginx cannot read
# a build under ~/opt); the API runs under pm2 as rusky-api on 127.0.0.1:3010.
# `certbot --nginx -d rusky.holocron66.xyz` adds the HTTPS server and the redirect to it.
server {
    listen 80;
    listen [::]:80;
    server_name rusky.holocron66.xyz;

    root /var/www/rusky;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Claude connector and its OAuth discovery documents.
    location = /mcp {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/oauth- {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
